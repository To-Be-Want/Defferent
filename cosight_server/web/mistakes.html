<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的错题本 · 星轨智学</title><link rel="icon" type="image/svg+xml" href="images/xinggui-logo.svg"><link rel="stylesheet" href="styles/mistakes.css"><link rel="stylesheet" href="styles/purple-theme.css"><script src="js/auth.js"></script></head>
<body><header class="notebook-header"><a href="/cosight/" class="brand"><img class="brand-glyph" src="images/xinggui-logo.svg" alt="">星轨智学</a><nav><a href="/cosight/">返回学习主页</a><span id="notebook-user"></span></nav></header>
<main class="notebook"><div class="notebook-heading"><div><span class="eyebrow">MY MISTAKE NOTEBOOK</span><h1>我的错题本</h1><p>查看、整理和自主重做，均不需要联网或在线模型。</p></div><button id="add-mistake" class="primary">手动录入错题</button></div>
<section class="notebook-summary" aria-label="错题统计"><div><strong id="total-count">—</strong><span>累计错题</span></div><div><strong id="pending-count">—</strong><span>待复习</span></div><div><strong id="mastered-count">—</strong><span>已掌握</span></div></section>
<form id="mistake-filters" class="notebook-filters"><label>课程<select id="subject-filter"><option value="">全部课程</option></select></label><label>掌握情况<select id="status-filter"><option value="all">全部状态</option><option value="pending">待复习</option><option value="mastered">已掌握</option></select></label><label class="search-field">搜索题目或知识点<input id="mistake-search" type="search" maxlength="200" placeholder="输入关键词"></label><button type="submit">筛选</button></form>
<p class="review-notice">自主重做：先在纸上或心里作答，再展开参考答案对照。连续两次自评正确会标记为已掌握；自评错误会恢复为待复习。这不是AI自动判分。</p>
<p id="notebook-error" role="alert"></p><p id="notebook-result" role="status"></p><section id="mistake-list" aria-label="错题列表" aria-busy="true"></section>
<div class="notebook-pagination"><button type="button" id="previous-page">上一页</button><span id="page-label"></span><button type="button" id="next-page">下一页</button></div>
</main>
<dialog id="add-mistake-dialog"><form id="add-mistake-form"><h2>手动录入错题</h2><p>填入你已有的题目和参考答案，不调用在线模型。</p><label>所属课程<input name="subject" id="new-mistake-subject" maxlength="40" placeholder="例如：高等数学；可暂时留空"></label><label>题目<textarea name="question" id="new-mistake-question" rows="4" required maxlength="16000"></textarea></label><label>参考答案<textarea name="correct_answer" id="new-mistake-answer" rows="3" required maxlength="16000"></textarea></label><label>解析或备注（可选）<textarea name="explanation" id="new-mistake-explanation" rows="3" maxlength="20000"></textarea></label><p id="add-mistake-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-add-mistake">取消</button><button type="submit" id="save-new-mistake" class="primary">保存错题</button></div></form></dialog>
<script src="js/mistakes.js"></script></body></html>
