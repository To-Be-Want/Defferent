<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>计划总览 · 星轨智学</title><link rel="icon" type="image/svg+xml" href="images/xinggui-logo.svg">
<link rel="stylesheet" href="styles/mistakes.css"><link rel="stylesheet" href="styles/purple-theme.css?v=20261025-plans"><link rel="stylesheet" href="styles/plans.css">
<script src="js/auth.js"></script><link rel="stylesheet" href="/cosight/styles/study-experience.css?v=20261029-2"><script defer src="/cosight/js/study-experience.js?v=20261029-2"></script></head>
<body class="plans-page"><header class="notebook-header"><a href="/cosight/" class="brand"><img class="brand-glyph" src="images/xinggui-logo.svg" alt="">星轨智学</a><nav><a href="/cosight/">返回学习主页</a><span id="plans-user"></span></nav></header>
<main class="planner">
  <div class="planner-heading"><div><p class="eyebrow">学习安排</p><h1>计划总览</h1><p>查看整个复习期的任务，也可以添加课程之外的个人事项。</p></div><div class="planner-actions"><button type="button" id="plans-exams">考试排期</button><button type="button" id="add-personal-task" class="primary">＋ 添加事项</button></div></div>
  <div class="planner-summary" aria-live="polite"><div><strong id="plans-total">—</strong><span>全部任务</span></div><div><strong id="plans-done">—</strong><span>已完成</span></div><div><strong id="plans-time">—</strong><span>预计总分钟</span></div><p id="plans-range"></p></div>
  <div class="planner-toolbar"><div class="planner-views" aria-label="查看方式"><button type="button" id="view-calendar" aria-pressed="true">日历与当日任务</button><button type="button" id="view-list" aria-pressed="false">整个复习期列表</button></div><label><input type="checkbox" id="include-archived"> 包含已考完课程</label></div>
  <div class="planner-filters"><label>课程 / 来源<select id="plans-subject"><option value="all">全部任务</option><option value="manual">个人事项</option></select></label><label>状态<select id="plans-status"><option value="all">全部状态</option><option value="待办">未完成</option><option value="完成">已完成</option></select></label><label class="planner-search">搜索<input id="plans-search" type="search" placeholder="任务名称、课程或备注"></label><button type="button" id="plans-reset">清除筛选</button></div>
  <p id="plans-notice" class="planner-note">复习任务采用各门课程的最新计划。手动事项独立保存，不会被复习计划重排覆盖。</p>
  <p id="plans-error" role="alert"></p>
  <div id="calendar-view" class="planner-calendar-layout">
    <section class="planner-calendar" aria-label="学习日历"><div class="month-header"><button type="button" id="month-prev" aria-label="上个月">‹</button><h2 id="month-title"></h2><button type="button" id="month-next" aria-label="下个月">›</button><button type="button" id="calendar-today">今天</button></div><div class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar-days" class="calendar-days"></div><p class="calendar-legend">紫点：有任务　数字：已完成 / 总数　考试标签：当日考试</p></section>
    <section class="planner-day"><div class="day-heading"><div><h2 id="selected-date"></h2><p id="day-summary"></p></div><button type="button" id="day-add-task">＋ 添加事项</button></div><div id="day-exams"></div><div id="day-tasks"></div></section>
  </div>
  <section id="list-view" hidden><div class="list-heading"><h2>整个复习期的任务</h2><p id="list-summary"></p></div><div id="all-plan-tasks"></div></section>
</main>
<dialog id="personal-task-dialog" aria-labelledby="personal-task-title"><form id="personal-task-form"><h2 id="personal-task-title">添加个人事项</h2><p>可以记录作业、实验报告、组会等；不需要调用在线模型。</p><label>事项名称<input id="personal-title" required maxlength="120" placeholder="例如：提交实验报告"></label><div class="personal-form-row"><label>日期<input id="personal-date" type="date" required></label><label>预计分钟<input id="personal-minutes" type="number" min="0" max="1440" step="1" value="30" required></label></div><label>重要程度<select id="personal-priority"><option value="high">重要</option><option value="normal" selected>普通</option><option value="low">较低</option></select></label><label>备注<textarea id="personal-notes" rows="3" maxlength="2000"></textarea></label><p id="personal-error" role="alert"></p><div class="dialog-actions"><button type="button" id="personal-cancel">取消</button><button type="submit" id="personal-save" class="primary">保存事项</button></div></form></dialog>
<script src="js/exam-schedule.js?v=20261025-plans"></script><script src="js/plans.js"></script></body></html>
